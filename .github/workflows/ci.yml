name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Lint & Test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements-dev.txt -r services/worker/requirements-dev.txt
          pip install -e services/api -e services/worker

      - name: Run Ruff Linter
        run: |
          ruff check services/api services/worker
          ruff format --check services/api services/worker

      - name: Run Mypy Type Checker
        run: |
          mypy services/api/src
          mypy services/worker/src

      - name: Run Tests with Coverage
        run: |
          pytest services/api --cov=api --cov-report=xml
          pytest services/worker --cov=worker --cov-report=xml

