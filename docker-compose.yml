services:
  postgres:
    image: postgres:16-alpine
    container_name: convo-glasses-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: convo_glasses
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d convo_glasses"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: convo-glasses-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  elasticmq:
    image: softwaremill/elasticmq-native:1.6.6
    container_name: convo-glasses-elasticmq
    restart: unless-stopped
    ports:
      - "9324:9324"
    volumes:
      - ./infra/docker/elasticmq.conf:/opt/docker/conf/elasticmq.conf:ro

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: convo-glasses-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/convo_glasses
      DATABASE_URL_SYNC: postgresql://postgres:postgres@postgres:5432/convo_glasses
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: convo-glasses-documents
      SQS_ENDPOINT_URL: http://elasticmq:9324
      SQS_QUEUE_URL: http://elasticmq:9324/000000000000/convo-glasses-jobs
      AUTH_BYPASS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticmq:
        condition: service_started

  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: convo-glasses-worker
    restart: unless-stopped
    environment:
      ENVIRONMENT: local
      SQS_ENDPOINT_URL: http://elasticmq:9324
      SQS_QUEUE_URL: http://elasticmq:9324/000000000000/convo-glasses-jobs
    depends_on:
      postgres:
        condition: service_healthy
      elasticmq:
        condition: service_started

volumes:
  postgres_data:
  minio_data:

