include classpath("application.conf")

node-address {
    protocol = http
    host = elasticmq
    port = 9324
    context = ""
}

rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
    sqs-limits = strict
}

queues {
    convo-glasses-jobs {
        defaultVisibilityTimeout = 30 seconds
        delay = 0 seconds
        receiveMessageWait = 0 seconds
    }
}
