apiVersion: apps/v1
kind: Deployment
metadata:
  name: convo-glasses-worker
  labels:
    app.kubernetes.io/name: convo-glasses-worker
    app.kubernetes.io/part-of: convo-glasses
spec:
  replicas: 1
  selector:
    matchLabels:
      app: convo-glasses-worker
  template:
    metadata:
      labels:
        app: convo-glasses-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: worker
          image: convo-glasses-worker:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: convo-glasses-config
            - secretRef:
                name: convo-glasses-secrets
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import time, sys; from pathlib import Path; f = Path('/tmp/worker_healthy'); sys.exit(0 if f.exists() and time.time() - float(f.read_text()) < 60 else 1)"
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

